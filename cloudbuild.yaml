steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/prompt2cal-backend', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/prompt2cal-backend']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'prompt2cal-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/prompt2cal-backend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # Calendar tokens live in Cloud Storage so sign-ins survive restarts and
      # are shared by every instance. The bucket must exist, and the service's
      # runtime service account needs roles/storage.objectUser on it.
      - '--execution-environment'
      - 'gen2'
      - '--add-volume'
      - 'name=user-tokens,type=cloud-storage,bucket=${_TOKEN_BUCKET}'
      - '--add-volume-mount'
      - 'volume=user-tokens,mount-path=/mnt/user-tokens'
      - '--update-env-vars'
      - 'TOKEN_STORAGE_DIR=/mnt/user-tokens'

substitutions:
  _TOKEN_BUCKET: '${PROJECT_ID}-prompt2cal-tokens'

options:
  dynamicSubstitutions: true

images:
  - 'gcr.io/$PROJECT_ID/prompt2cal-backend'

